name: Docker

'on':
  release:
    types: [published]

jobs:
  docker:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stunning-octo-goggles
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Bump chart image tag
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: chart-bump
      cancel-in-progress: false

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set image tag and appVersion
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          CHART=charts/stunning-octo-goggles
          sed -i -E "s|^(  tag: ).*|\1${VERSION}|" "${CHART}/values.yaml"
          sed -i -E "s|^(appVersion: ).*|\1\"${VERSION}\"|" "${CHART}/Chart.yaml"
          grep -qx "  tag: ${VERSION}" "${CHART}/values.yaml"
          grep -qx "appVersion: \"${VERSION}\"" "${CHART}/Chart.yaml"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Chart already at ${VERSION}, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): ${VERSION} [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
